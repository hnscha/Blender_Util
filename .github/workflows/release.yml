name: Release add-on

# Two ways to release one add-on folder:
#   1. Push a tag named <addon_folder>-v<version>, e.g. dcc_navigation-v1.0.0.
#   2. Actions tab > "Release add-on" > Run workflow, and type the folder name.
#      The version is read from its blender_manifest.toml and the tag is created.
# The folder is zipped with blender_manifest.toml at the zip root, which is the
# layout Blender's "Install from Disk" and drag-and-drop expect.

on:
  push:
    tags:
      - "*-v*"
  workflow_dispatch:
    inputs:
      addon:
        description: "Add-on folder name (e.g. dcc_navigation)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve add-on and version
        id: meta
        env:
          INPUT_ADDON: ${{ inputs.addon }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            addon="${INPUT_ADDON}"
          else
            addon="${GITHUB_REF_NAME%-v*}"
          fi
          manifest="${addon}/blender_manifest.toml"
          if [ ! -f "$manifest" ]; then
            echo "::error::No add-on folder '${addon}' with blender_manifest.toml"
            exit 1
          fi
          version=$(grep -E '^version *=' "$manifest" | head -1 | sed -E 's/^version *= *"([^"]+)".*/\1/')
          tag="${addon}-v${version}"
          if [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ] && [ "${GITHUB_REF_NAME}" != "$tag" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match ${manifest} version ${version}"
            exit 1
          fi
          echo "addon=${addon}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "zip=${addon}-${version}.zip" >> "$GITHUB_OUTPUT"

      - name: Build zip
        run: |
          cd "${{ steps.meta.outputs.addon }}"
          zip -r "../${{ steps.meta.outputs.zip }}" . -x "__pycache__/*" "*/__pycache__/*" "*.pyc" ".*"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.meta.outputs.addon }} ${{ steps.meta.outputs.version }}
          files: ${{ steps.meta.outputs.zip }}
          body: |
            Install: drag `${{ steps.meta.outputs.zip }}` into the Blender window,
            or Edit > Preferences > Add-ons > Install from Disk (Blender 4.2+).
